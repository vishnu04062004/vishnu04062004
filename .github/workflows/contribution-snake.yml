name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vishnu04062004
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237C3AED&color_dots=%23161B22,%231F1235,%233B1368,%237C3AED,%23C084FC
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F472B6&color_dots=%23161B22,%231F1235,%233B1368,%237C3AED,%23C084FC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated animation
        uses: EndBug/add-and-commit@v9
        with:
          add: "dist"
          message: "Update contribution snake [skip ci]"
